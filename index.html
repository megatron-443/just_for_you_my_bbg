<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A Letter Just For You</title>
    
    <!-- Preload critical assets -->
    <link rel="preload" as="image" href="image%20(1).webp">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['"DM Serif Display"', 'serif'] },
                    colors: {
                        brand: { text: '#4a3242', highlight: '#d51a67', subtext: '#8a717e' }
                    },
                    animation: { 'spin-slow': 'spin 8s linear infinite' }
                }
            }
        }
    </script>

    <style>
        body {
            /* Rich blush-to-rose gradient */
            background: linear-gradient(180deg, #ffdbe6 0%, #ffccd8 30%, #fec5d8 60%, #fbcfe8 100%);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body.locked { overflow: hidden; height: 100dvh; }

        /* Hide Scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Authentic Glassmorphism - Ultra Sheer Lens */
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            /* Specular rim lighting (top/left bright, bottom dark) */
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9), 
                        inset 1px 0 1px rgba(255, 255, 255, 0.4),
                        0 20px 40px rgba(213, 26, 103, 0.08);
        }
        
        /* Solid lock screen panel */
        .glass-panel-solid { 
            background: rgba(255, 255, 255, 0.96); 
            box-shadow: 0 20px 50px rgba(220, 150, 170, 0.25); 
        }

        /* Instagram Carousel Dots */
        .dot { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .dot.active { opacity: 1; transform: scale(1.3); background-color: #d51a67; }

        /* Pure CSS GPU Particles */
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: var(--max-opacity); }
            90% { opacity: var(--max-opacity); }
            100% { transform: translateY(-15vh) rotate(var(--rot)); opacity: 0; }
        }
        
        @keyframes tumbleDown {
            0% { transform: translateY(-10vh) rotate3d(1, 1, 0, 0deg); opacity: 0; }
            10% { opacity: var(--max-opacity); }
            90% { opacity: var(--max-opacity); }
            100% { transform: translateY(110vh) rotate3d(1, 1.5, 0.5, 720deg); opacity: 0; }
        }
        
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
        }

        .particle-item { position: fixed; pointer-events: none; will-change: transform; }

        /* Distinct Branch Swaying */
        @keyframes swayTop {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(-2deg); }
        }
        @keyframes swayBottom {
            0%, 100% { transform: scaleX(-1) rotate(-15deg); }
            50% { transform: scaleX(-1) rotate(-10deg); }
        }
        .branch-top { transform-origin: top left; animation: swayTop 8s ease-in-out infinite; }
        .branch-bottom { transform-origin: bottom right; animation: swayBottom 9s ease-in-out infinite; }

        /* Vinyl Styling */
        .vinyl-grooves { background: repeating-radial-gradient( #111 0px, #1a1a1a 2px, #111 4px ); }
        .vinyl-paused { animation-play-state: paused !important; }
        
        /* Input Hacks */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-6px); } }
        .shake { animation: shake 0.4s ease-in-out; color: #ef4444; }
        #passcode-input { caret-color: transparent; color: transparent; background: transparent; }

        /* Scroll Reveal Pacing */
        .reveal-item {
            opacity: 0;
            transform: translateY(25px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="relative font-serif flex flex-col items-center text-brand-text locked">

    <!-- ============================================================== -->
    <!-- CONFIGURATION BLOCK                                            -->
    <!-- ============================================================== -->
    <script>
        const CONFIG = {
            passcode: "deep", 
            
            songName: "dTmf",
            artistName: "Lil Baby Grand",
            albumArt: "cover.webp", 
            musicUrl: "song.mp3",

            greeting: "My dearest Arya,",
            paragraphs: [
                "Today, 26th of September 2026 marks 19 years of your life on this planet",

    <!-- ============================================================== -->

    <!-- Ambient Background Particles -->
    <div id="particles-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>
    
    <!-- Top Progress Bar (Love Meter) -->
    <div id="scroll-progress-container" class="fixed top-0 left-0 w-full h-[3px] z-50 opacity-0 transition-opacity duration-1000 pointer-events-none">
        <div id="scroll-progress" class="h-full bg-gradient-to-r from-[#ffccd8] to-brand-highlight w-0 relative rounded-r-full">

    <!-- Mini Floating Vinyl (Sticky Audio Control) -->
    <div id="mini-vinyl-btn" class="fixed top-4 right-4 z-50 opacity-0 translate-y-[-20px] transition-all duration-500 pointer-events-auto cursor-pointer flex items-center gap-2 bg-white/40 backdrop-blur-md px-3 py-1.5 rounded-full shadow-sm border border-white/50">
        <div class="text-[11px] font-sans text-brand-text font-medium tracking-wide uppercase opacity-80" id="mini-song-name"></div>
        <div class="w-7 h-7 rounded-full bg-black shadow-md flex items-center justify-center animate-spin-slow vinyl-grooves vinyl-paused" id="mini-vinyl-disc">
            <div class="w-2.5 h-2.5 rounded-full overflow-hidden border border-gray-600 bg-gray-800">
                <img id="mini-album-art" src="" class="w-full h-full object-cover">
            </div>

    <!-- ============================================================== -->
    <!-- LOCK SCREEN                                                    -->
    <!-- ============================================================== -->
    <div id="pin-screen" class="fixed inset-0 h-[100dvh] z-[60] flex items-center justify-center p-6 transition-all duration-1000 ease-in-out bg-black/5 backdrop-blur-sm">
        <div class="glass-panel-solid relative w-full max-w-[22rem] rounded-[2rem] px-8 py-10 flex flex-col items-center">
            
            <div class="w-12 h-12 rounded-full bg-pink-50 flex items-center justify-center mb-6 text-brand-highlight border border-pink-100 shadow-sm">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            </div>

            <h2 class="text-[2.2rem] text-brand-highlight mb-10 font-bold text-center leading-tight">A letter for you</h2>

            <!-- Hidden-Mirror Input -->
            <div class="relative flex items-center justify-center text-brand-text mb-8 w-full cursor-text py-2" onclick="document.getElementById('passcode-input').focus()">
                <span class="mr-3 text-[1.4rem] tracking-wide italic font-serif opacity-90 mt-1">i love</span>
                <div class="flex gap-1.5 mt-2" id="slot-container">
                    <span class="slot w-6 text-center border-b-[2.5px] border-brand-subtext/40 h-8 leading-8 text-[1.4rem] font-bold transition-colors"></span>
                    <span class="slot w-6 text-center border-b-[2.5px] border-brand-subtext/40 h-8 leading-8 text-[1.4rem] font-bold transition-colors"></span>
                    <span class="slot w-6 text-center border-b-[2.5px] border-brand-subtext/40 h-8 leading-8 text-[1.4rem] font-bold transition-colors"></span>
                    <span class="slot w-6 text-center border-b-[2.5px] border-brand-subtext/40 h-8 leading-8 text-[1.4rem] font-bold transition-colors"></span>
                </div>
                <input type="text" id="passcode-input" maxlength="4" class="absolute inset-0 opacity-0 w-full h-full cursor-text z-10 text-[16px]" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none">
            </div>
            
            <button id="unlock-btn" class="w-full bg-brand-highlight hover:bg-pink-700 text-white font-sans font-medium tracking-wide text-[1.05rem] py-4 rounded-full shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 mt-2">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Unlock
            </button>
        </div>
        
        <!-- Audio Player preloading immediately -->
        <audio id="bg-audio" loop preload="auto"></audio>
    </div>

    <!-- ============================================================== -->
    <!-- MAIN LETTER CONTENT                                            -->
    <!-- ============================================================== -->
    <!-- Branches updated to z-30 so they float OVER the glass card -->
    <div class="fixed top-0 left-0 pointer-events-none z-30 w-64 md:w-80 opacity-90 -translate-x-4 -translate-y-4 branch-top">
        <img src="branch.png" alt="" class="w-full h-auto drop-shadow-xl" onerror="this.style.display='none'">
    </div>
    <div class="fixed bottom-0 right-0 pointer-events-none z-30 w-72 md:w-96 opacity-90 translate-x-4 translate-y-6 branch-bottom">
        <img src="branch.png" alt="" class="w-full h-auto drop-shadow-xl" onerror="this.style.display='none'">
    </div>

    <!-- Main wrapped in Z-20 -->
    <main id="main-content" class="relative z-20 w-full max-w-xl mx-auto px-5 py-16 flex flex-col items-center opacity-0 pointer-events-none transition-all duration-[1500ms] ease-out min-h-screen transform translate-y-8 pb-32">
        
        <!-- Translucent Milky Canvas -->
        <article class="glass-panel w-full rounded-[2.5rem] px-6 md:px-10 py-14 flex flex-col items-center relative mt-4 shadow-2xl">
            
            <!-- Interactive Vinyl Player -->
            <div id="vinyl-player" class="flex flex-col items-center mb-12 w-full -mt-4 transition-all duration-1000 ease-in opacity-0 cursor-pointer group active:scale-95">
                <div class="relative w-44 h-44 rounded-full bg-black shadow-[0_20px_40px_rgba(0,0,0,0.3)] flex items-center justify-center animate-spin-slow vinyl-grooves border-[3px] border-gray-900" id="vinyl-disc">
                    <div class="absolute inset-0 rounded-full bg-gradient-to-br from-white/20 via-transparent to-transparent pointer-events-none"></div>
                    <div class="relative w-16 h-16 rounded-full overflow-hidden border border-gray-600 bg-gray-800 flex items-center justify-center shadow-inner">
                        <img id="ui-album-art" src="" alt="Cover" class="w-full h-full object-cover" onerror="this.style.display='none'">
                        <div class="absolute w-3 h-3 bg-gray-900 rounded-full shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)] z-10"></div>
                    </div>
                </div>
                <div class="text-center mt-6">
                    <h3 id="ui-song-name" class="font-serif text-2xl font-bold tracking-wide text-brand-text group-hover:text-brand-highlight transition-colors"></h3>
                    <p id="ui-artist-name" class="font-sans text-[0.9rem] text-brand-subtext tracking-wider mt-1 uppercase"></p>
                </div>
            </div>

            <h1 id="ui-greeting" class="text-[2.2rem] font-bold leading-tight text-brand-highlight mb-10 w-full text-center"></h1>
            
            <!-- Paragraph Container -->
            <div id="ui-paragraphs" class="flex flex-col text-[1.25rem] leading-relaxed text-brand-text font-medium w-full text-center"></div>
            
            <div class="mt-16 w-full text-center reveal-item">
                <p id="ui-signoff-text" class="text-xl text-brand-highlight font-semibold tracking-wide"></p>
                <p id="ui-signoff-name" class="text-[2.4rem] italic mt-3 text-brand-text"></p>
            </div>
        </article>

        <!-- Image Carousel -->
        <section class="mt-16 w-full flex flex-col items-center relative z-40 reveal-item">
            <h2 class="font-serif text-[1.8rem] font-bold text-brand-highlight mb-6 tracking-wide text-center drop-shadow-sm">You from my eyes~</h2>
            
            <div id="ui-carousel" class="w-full h-[50vh] flex overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth touch-pan-x rounded-2xl"></div>
            
            <div id="carousel-dots-container" class="flex justify-center items-center gap-2 mt-6 flex-wrap px-4"></div>
        </section>
    </main>

    <!-- ============================================================== -->
    <!-- LOGIC SCRIPT                                                   -->
    <!-- ============================================================== -->
    <script>
        // --- 1. Content Injection & Scroll Reveal Formatting ---
        document.getElementById('bg-audio').src = CONFIG.musicUrl;
        document.getElementById('ui-song-name').textContent = CONFIG.songName;
        document.getElementById('mini-song-name').textContent = CONFIG.songName;
        document.getElementById('ui-artist-name').textContent = CONFIG.artistName;
        document.getElementById('ui-album-art').src = CONFIG.albumArt;
        document.getElementById('mini-album-art').src = CONFIG.albumArt;
        document.getElementById('ui-greeting').textContent = CONFIG.greeting;
        
        const paraContainer = document.getElementById('ui-paragraphs');
        
        // Pacing configuration
        const dividersAfter = [1, 3, 7];
        const pullQuoteIndex = 4;

        CONFIG.paragraphs.forEach((text, index) => {
            const p = document.createElement('p');
            p.textContent = text;
            
            if (index === pullQuoteIndex) {
                // Style as a beautiful glowing pull-quote
                p.className = "reveal-item text-[1.6rem] leading-snug italic font-semibold text-brand-highlight my-10 py-8 border-y border-brand-highlight/20 relative";
            } else {
                p.className = "reveal-item mb-8"; // Standard spacing
            }
            
            paraContainer.appendChild(p);

            // Insert botanical rhythm dividers
            if (dividersAfter.includes(index)) {
                const divider = document.createElement('div');
                divider.className = "reveal-item text-brand-highlight/40 text-center tracking-[0.5em] text-lg my-6";
                divider.innerHTML = "✦ &nbsp;· &nbsp;✧ &nbsp;· &nbsp;✦";
                paraContainer.appendChild(divider);
            }
        });
        
        document.getElementById('ui-signoff-text').textContent = CONFIG.signOffText;
        document.getElementById('ui-signoff-name').textContent = CONFIG.signOffName;

        // --- 2. Audio Engine & Vinyl Syncing ---
        const audio = document.getElementById('bg-audio');
        const vinylDisc = document.getElementById('vinyl-disc');
        const miniVinylDisc = document.getElementById('mini-vinyl-disc');
        const mainVinylPlayer = document.getElementById('vinyl-player');
        const miniVinylBtn = document.getElementById('mini-vinyl-btn');
        
        const toggleAudio = () => {
            if (audio.paused) {
                audio.play();
                vinylDisc.classList.remove('vinyl-paused');
                miniVinylDisc.classList.remove('vinyl-paused');
            } else {
                audio.pause();
                vinylDisc.classList.add('vinyl-paused');
                miniVinylDisc.classList.add('vinyl-paused');
            }
        };

        mainVinylPlayer.addEventListener('click', toggleAudio);
        miniVinylBtn.addEventListener('click', toggleAudio);

        // --- 3. Passcode Logic ---
        const passInput = document.getElementById('passcode-input');
        const slots = document.querySelectorAll('.slot');
        const slotContainer = document.getElementById('slot-container');
        const unlockBtn = document.getElementById('unlock-btn');
        const TARGET_PASS = CONFIG.passcode.toLowerCase().trim();

        const unlockSequence = () => {
            const val = passInput.value.toLowerCase().trim();
            if (val === TARGET_PASS) {
                passInput.blur(); // Drop iOS keyboard instantly
                
                // Native immediate playback to bypass iOS constraints
                audio.volume = 0.6;
                audio.play().catch(e => console.log("Audio native play prevented:", e));
                vinylDisc.classList.remove('vinyl-paused');
                miniVinylDisc.classList.remove('vinyl-paused');

                // Fade out lockscreen
                const lockScreen = document.getElementById('pin-screen');
                lockScreen.style.opacity = '0';
                lockScreen.style.pointerEvents = 'none';
                
                // Reveal main content & meter
                document.body.classList.remove('locked');
                const main = document.getElementById('main-content');
                main.style.opacity = '1';
                main.style.pointerEvents = 'auto';
                main.classList.remove('translate-y-8');
                main.classList.add('translate-y-0');
                
                document.getElementById('scroll-progress-container').style.opacity = '1';

                setTimeout(() => mainVinylPlayer.classList.remove('opacity-0'), 800);
                setTimeout(() => lockScreen.remove(), 1000);
            } else {
                slotContainer.classList.remove('shake');
                void slotContainer.offsetWidth; // Reflow
                slotContainer.classList.add('shake');
                slots.forEach(slot => {
                    slot.classList.replace('text-brand-text', 'text-red-500');
                    slot.classList.replace('border-brand-text', 'border-red-400');
                });
                setTimeout(() => { passInput.value = ''; passInput.dispatchEvent(new Event('input')); }, 400);
            }
        };

        passInput.addEventListener('input', () => {
            const val = passInput.value.toLowerCase();
            slots.forEach((slot, index) => {
                slot.textContent = val[index] || '';
                slot.classList.remove('text-red-500', 'border-red-400');
                if (val[index]) {
                    slot.classList.replace('border-brand-subtext/40', 'border-brand-text');
                    slot.classList.add('text-brand-text');
                } else {
                    slot.classList.replace('border-brand-text', 'border-brand-subtext/40');
                    slot.classList.remove('text-brand-text');
                }
            });
            slotContainer.classList.remove('shake');
            
            if (val.length === 4) unlockSequence(); // Auto-unlock on 4th letter
        });

        passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') unlockSequence();
        });
        unlockBtn.addEventListener('click', unlockSequence);

        // --- 4. Intersection Observers (Scroll Reveal & Sticky Vinyl) ---
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: "0px 0px -50px 0px" });

        document.querySelectorAll('.reveal-item').forEach(el => revealObserver.observe(el));

        // Toggle mini-vinyl visibility when main player leaves screen
        const playerObserver = new IntersectionObserver((entries) => {
            const isMainVisible = entries[0].isIntersecting;
            if (isMainVisible || document.body.classList.contains('locked')) {
                miniVinylBtn.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
                miniVinylBtn.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
            } else {
                miniVinylBtn.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
                miniVinylBtn.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
            }
        }, { threshold: 0 });
        playerObserver.observe(mainVinylPlayer);

        // --- 5. Love Meter (Scroll Progress) ---
        const progressBar = document.getElementById('scroll-progress');
        window.addEventListener('scroll', () => {
            if (document.body.classList.contains('locked')) return;
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = Math.min(100, Math.max(0, (scrollTop / docHeight) * 100));
            progressBar.style.width = scrollPercent + '%';
        });

        // --- 6. Carousel Logic ---
        const carousel = document.getElementById('ui-carousel');
        const dotsContainer = document.getElementById('carousel-dots-container');

        CONFIG.photos.forEach((fileName, index) => {
            const safeUrl = encodeURI(fileName);
            const item = document.createElement('div');
            item.className = "shrink-0 w-full h-full snap-always snap-center flex items-center justify-center px-2";
            const lazyAttr = index === 0 ? '' : 'loading="lazy"';
            item.innerHTML = `<img src="${safeUrl}" alt="You from my eyes~" ${lazyAttr} class="w-full h-full object-contain drop-shadow-md rounded-xl">`;
            carousel.appendChild(item);

            const dot = document.createElement('div');
            dot.className = `dot w-2 h-2 rounded-full bg-brand-subtext/30 ${index === 0 ? 'active bg-brand-highlight' : ''}`;
            dotsContainer.appendChild(dot);
        });

        const dots = dotsContainer.children;
        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / carousel.offsetWidth);
            for(let i = 0; i < dots.length; i++) {
                if(i === index) {
                    dots[i].classList.add('active', 'bg-brand-highlight');
                    dots[i].classList.remove('bg-brand-subtext/30');
                } else {
                    dots[i].classList.remove('active', 'bg-brand-highlight');
                    dots[i].classList.add('bg-brand-subtext/30');
                }
            }
        });

        // --- 7. Pure CSS Multi-Layer Particle System ---
        const pContainer = document.getElementById('particles-container');
        const svgHeart = (c) => `<svg viewBox="0 0 24 24" fill="${c}" class="w-full h-full"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
        const svgPetal = () => `<svg viewBox="0 0 30 30" fill="#f472b6" class="w-full h-full"><path d="M15 0 C25 8 28 20 15 30 C2 20 5 8 15 0 Z"/></svg>`;
        const svgStar = () => `<svg viewBox="0 0 24 24" fill="#ffffff" class="w-full h-full drop-shadow-sm"><path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9L12 2Z"/></svg>`;

        // Macro Bokeh (Deep Background)
        for (let i = 0; i < 8; i++) {
            const el = document.createElement('div');
            el.className = 'fixed rounded-full pointer-events-none opacity-20';
            el.style.width = (Math.random() * 150 + 100) + 'px';
            el.style.height = el.style.width;
            el.style.left = (Math.random() * 100) + 'vw';
            el.style.top = (Math.random() * 100) + 'vh';
            el.style.background = 'radial-gradient(circle, rgba(251,113,133,0.8) 0%, rgba(251,113,133,0) 70%)';
            el.style.filter = 'blur(15px)';
            el.style.animation = `pulseGlow ${Math.random() * 10 + 10}s ease-in-out infinite alternate`;
            pContainer.appendChild(el);
        }

        // Floating Hearts & Stars
        for (let i = 0; i < 25; i++) {
            const el = document.createElement('div');
            el.className = 'particle-item';
            const rand = Math.random();
            let size, isFalling = false;
            
            if (rand < 0.6) { // Hearts
                el.innerHTML = svgHeart('rgba(244, 114, 182, 0.5)');
                size = Math.random() * 25 + 16;
            } else if (rand < 0.8) { // Petals
                el.innerHTML = svgPetal();
                size = Math.random() * 14 + 10;
                isFalling = true;
            } else { // Stars
                el.innerHTML = svgStar();
                size = Math.random() * 8 + 4;
            }

            const duration = Math.random() * 25 + 15;
            const delay = Math.random() * -30; 
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = (Math.random() * 100) + 'vw';
            
            if (isFalling) {
                el.style.top = '0';
                el.style.animation = `tumbleDown ${duration * 0.7}s linear infinite`;
            } else {
                el.style.bottom = '0';
                el.style.animation = `floatUp ${duration}s linear infinite`;
            }
            
            el.style.animationDelay = `${delay}s`;
            el.style.setProperty('--rot', (Math.random() * 360) + 'deg');
            el.style.setProperty('--max-opacity', isFalling ? 0.9 : Math.random() * 0.4 + 0.3);
            pContainer.appendChild(el);
        }
    </script>
</body>
</html>
