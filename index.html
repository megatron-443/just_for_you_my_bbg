<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Letter Just For You</title>
    
    <!-- Preload first image for instant display -->
    <link rel="preload" as="image" href="image%20(1).webp">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Caveat:wght@500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#fbcfe8',
                            surface: 'rgba(255, 255, 255, 0.015)',
                            text: '#4a044e',
                            highlight: '#be185d',
                            subtext: '#831843'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        hand: ['Caveat', 'cursive']
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'float-up': 'floatUp 15s linear infinite',
                        'tumble': 'tumble 12s linear infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        floatUp: {
                            '0%': { transform: 'translateY(100vh) scale(0.5)', opacity: '0' },
                            '10%': { opacity: '0.4' },
                            '90%': { opacity: '0.4' },
                            '100%': { transform: 'translateY(-20vh) scale(1.2)', opacity: '0' }
                        },
                        tumble: {
                            '0%': { transform: 'translateY(-10vh) translateX(0) rotate3d(1, 1, 1, 0deg)', opacity: '0' },
                            '10%': { opacity: '0.6' },
                            '90%': { opacity: '0.6' },
                            '100%': { transform: 'translateY(110vh) translateX(20px) rotate3d(1, 1, 1, 360deg)', opacity: '0' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #ffdbe6 0%, #fbcfe8 100%);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        /* Ambient Particle System */
        .particles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .macro-heart {
            position: absolute;
            color: rgba(244, 114, 182, 0.25);
            filter: blur(15px);
            animation: floatUp linear infinite;
        }
        .falling-petal {
            position: absolute;
            width: 12px; height: 18px;
            background: #f472b6;
            border-radius: 50% 0 50% 0;
            opacity: 0.6;
            animation: tumble linear infinite;
        }
        .stardust {
            position: absolute;
            color: white;
            font-size: 8px;
            animation: floatUp linear infinite;
            filter: blur(1px);
        }

        /* TRUE SHEER GLASSMORPHISM */
        .glass-panel {
            background: rgba(255, 255, 255, 0.015); /* Barely visible for maximum translucency */
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-panel-solid { 
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        /* Distinct Branch Styling */
        .branch-fixed {
            position: fixed;
            z-index: 10; /* Branches sit between particles (1) and glass (30) */
            pointer-events: none;
            width: 280px;
            max-width: 65vw;
        }
        .branch-top {
            top: -20px;
            left: -20px;
            transform-origin: top left;
            animation: swayTop 6s ease-in-out infinite alternate;
        }
        .branch-bottom {
            bottom: -30px;
            right: -20px;
            transform-origin: bottom right;
            transform: scaleX(-1) rotate(-15deg); /* Distinct orientation */
            animation: swayBottom 7s ease-in-out infinite alternate;
        }

        @keyframes swayTop { from { transform: rotate(0deg); } to { transform: rotate(3deg); } }
        @keyframes swayBottom { from { transform: scaleX(-1) rotate(-15deg); } to { transform: scaleX(-1) rotate(-12deg); } }

        /* Polaroid & Scroll */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .polaroid-card {
            background: #ffffff;
            /* Removed heavy drop shadow for cleaner look and smoother scroll */
            border: 1px solid #f0f0f0;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        /* Mobile-friendly swipe fix: Only apply hover transforms on non-touch devices */
        @media (hover: hover) and (pointer: fine) {
            .polaroid-card:hover { transform: scale(1.02) translateY(-5px) rotate(0deg) !important; z-index: 10; }
        }

        /* Vinyl Animation */
        .vinyl-paused { animation-play-state: paused !important; }

        /* Scroll Reveal Utility */
        .reveal-element {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-element.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Cake & Candles */
        .flame {
            animation: flicker 0.1s ease-in-out infinite alternate;
            transform-origin: bottom;
        }
        @keyframes flicker {
            0% { transform: scaleY(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scaleY(1.15) rotate(2deg); opacity: 1; }
        }
        .extinguished .flame {
            display: none;
        }
        .extinguished::after {
            content: '';
            position: absolute;
            top: -5px; left: 50%;
            width: 4px; height: 10px;
            background: rgba(100,100,100,0.4);
            border-radius: 5px;
            transform: translateX(-50%);
            animation: smokeFloat 2s ease-out forwards;
        }
        @keyframes smokeFloat {
            0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateX(-80%) translateY(-20px) scale(3); opacity: 0; }
        }
    </style>
</head>

    <!-- LOCK SCREEN OVERLAY -->
    <div id="lock-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-5 transition-all duration-1000">

                <div id="cake-interactive" class="relative w-full h-36 flex flex-col items-center justify-end mb-6 cursor-pointer group">

                            <div class="w-3 h-3 bg-white rounded-full"></div>

                    </div>

                <div class="w-full h-2.5 bg-pink-100/70 rounded-full overflow-hidden shadow-inner border border-pink-200/60 relative">

                </div>
                <div class="w-full flex justify-between items-center text-[10px] font-sans text-brand-subtext mt-1.5 px-0.5">

            </div>
            
        </div>
    </div>

    <!-- MAIN CONTENT (Hidden initially) -->
    <main id="main-content" class="w-full min-h-screen hidden opacity-0 flex-col items-center py-10 px-4 sm:px-6 relative z-30">
        
        <div class="glass-panel w-full max-w-lg rounded-[28px] p-6 sm:p-10 flex flex-col items-center mb-16 relative mt-[10vh]">
            
            <!-- Music Player Header -->
            <div class="w-full flex items-center justify-between mb-10 bg-white/40 rounded-2xl p-3 backdrop-blur-md shadow-sm border border-white/40">
                <div class="flex items-center gap-4">
                    <div class="relative w-14 h-14 rounded-full shadow-md overflow-hidden bg-gray-900 flex-shrink-0 animate-spin-slow vinyl-paused" id="vinyl-disc">
                        <img src="cover.webp" class="w-full h-full object-cover opacity-80" alt="Album Cover">
                        <div class="absolute inset-0 m-auto w-3 h-3 bg-white rounded-full shadow-inner border border-gray-300"></div>
                        <div class="absolute inset-0 rounded-full border border-white/20"></div>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-serif font-bold text-lg text-brand-text leading-tight">dTmf</span>
                        <span class="text-[10px] font-sans tracking-widest uppercase text-brand-subtext mt-0.5">Lil Baby Grand</span>
                    </div>
                </div>
            </div>

            <!-- Letter Content -->
            <h1 class="font-serif text-4xl sm:text-5xl font-bold text-brand-highlight mb-10 text-center">My dearest Arya,</h1>
            
            <div class="w-full font-serif text-[1.1rem] leading-[1.8] text-brand-text/90 flex flex-col gap-8 text-center" id="letter-body">

        </div>

        <!-- Polaroid Gallery Section -->
        <div class="w-full max-w-2xl flex flex-col items-center mb-24 relative z-30">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-brand-highlight text-xl">✦</span>
                <h2 class="font-serif text-2xl font-bold text-brand-highlight text-center">Our gallery</h2>
                <span class="text-brand-highlight text-xl">✦</span>
            </div>
            
            <div id="photo-carousel" class="w-full flex overflow-x-auto snap-x snap-mandatory hide-scrollbar gap-2 px-[8vw] pb-8 items-center touch-pan-x">
                <!-- Generated via JS -->
            </div>
            
            <!-- Dynamic Indicators -->
            <div class="flex flex-col items-center gap-3 mt-4">
                <div class="flex gap-1.5" id="carousel-indicators"></div>
                <div class="font-sans text-xs text-brand-subtext font-medium tracking-wide"><span id="gallery-counter">1</span> / 14</div>
            </div>
        </div>

    </main>

    <!-- Hidden Audio Player -->
    <audio id="bg-audio" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Data Configuration
        const CONFIG = {
            letterParagraphs: [
                "Today, 26th of September 2026 marks 19 years of your life on this planet",
                "Happiest of the happiest birthday to you my baby and I hope you have a great day today and all the upcoming days of your life 🥹❤️",
                "✦  ·  ✧  ·  ✦",
                "My love, I want you to know that every bit of happiness, joy and pleasure you get in your life it all belongs to you because you deserve it. You deserve all of it. I know that because I have been the longest AND closest with you and no one knows you better than me, so trust me when I say that you’re someone who deserves every ounce of happiness they get.",
                "The point is, I want you to see the kind of person you are. That is, a loving daughter who is willing to spend any amount to give her parents the life they deserve, the sister who is so protective and caring towards her brother even when he does something bad, the best friend who every person in their life needs, the available & helpful friend, the supportive & pushy & loving & caring wife— I can't put it into words how beautiful of a person you are, it would require me books to describe it, and that is just your personality. Describing your beauty and the way you look would take hundreds of books.",
                "✦  ·  ✧  ·  ✦",
                "You are such a charm. Everyone who has you in their life or had you has been blessed by the universe itself. I hope you know that. I'm sooooo lucky and grateful to be one of those people, to have 3 years of these 19 years, and get to love you. You have made me and my life better in so many ways that I can’t even tell how thankful I am to you.",
                "Please know that I’ll never forget this and the things you have done for me till today, I’ll always remember them and be grateful for them no matter what phase of life I’m in.",
                "You know, sometimes I feel sad that you don’t receive the same love and treatment from the people who you give so much love and care to, including your friends, like the way you make things for their birthday or the way you give them a special place.",
                "I want you to know that... ever since we have met, I have always tried to be that best friend, that partner and that best friend who you deserve. The person who you are to other people— but secretly want someone to treat you the same way. And as a gift, I will always try to be that person no matter what. Not out of pity, not out of anything but just of how beautiful you are as a person and because you deserve it.",
                "I love you sm my baby, I love you so much 💋.",
                "I’ll always love you, and I’m never going to leave you.",
                "Enjoy and have a great day tomorrow my love ❤️✨",
                "✦  ·  ✧  ·  ✦",
                "With all my love and care,<br><br><span class='font-hand text-3xl font-bold'>— Joy</span>"
            ],
            photos: [
                { src: "image (1).webp", caption: "My smol baby" },
                { src: "image (2).webp", caption: "Smile that makes my day" },
                { src: "image (3).webp", caption: "My babygirl" },
                { src: "image (4).webp", caption: "My wifey made something 🎀" },
                { src: "image (5).webp", caption: "" },
                { src: "image (6).webp", caption: "LMFAO" },
                { src: "image (7).webp", caption: "🤣🤣🤣" },
                { src: "image (8).webp", caption: "My princess" },
                { src: "image (9).webp", caption: "Our family <3" },
                { src: "image (10).webp", caption: "Hi boss" },
                { src: "image (11).webp", caption: "LMFAOOO" },
                { src: "image (12).webp", caption: "Your grace" },
                { src: "image (13).webp", caption: "👽" },
                { src: "image (14).webp", caption: "OMLLL" }
            ]
        };

        // Static Particle Generation (GPU Optimized)
        const generateParticles = () => {
            const container = document.getElementById('particles');
            const particleCount = 20;
            
            for(let i=0; i<particleCount; i++) {
                const isHeart = Math.random() > 0.5;
                const el = document.createElement(isHeart ? 'div' : 'div');
                
                if (isHeart) {
                    el.className = 'macro-heart';
                    el.innerHTML = '♥';
                    el.style.fontSize = `${Math.random() * 100 + 50}px`;
                    el.style.left = `${Math.random() * 100}vw`;
                    el.style.animationDuration = `${Math.random() * 20 + 20}s`;
                    el.style.animationDelay = `-${Math.random() * 20}s`;
                } else {
                    el.className = 'falling-petal';
                    el.style.left = `${Math.random() * 100}vw`;
                    el.style.animationDuration = `${Math.random() * 10 + 8}s`;
                    el.style.animationDelay = `-${Math.random() * 10}s`;
                }
                container.appendChild(el);
            }
        };

        // Populate Letter
        const letterContainer = document.getElementById('letter-body');
        CONFIG.letterParagraphs.forEach(p => {
            const el = document.createElement(p.includes('✦') ? 'div' : 'p');
            el.className = `reveal-element ${p.includes('✦') ? 'text-brand-highlight/40 tracking-[1em] text-sm my-4' : ''}`;
            if(p.startsWith('You are such a charm')) el.className += " font-bold italic text-brand-highlight text-xl my-4";
            el.innerHTML = p;
            letterContainer.appendChild(el);
        });

        // Microphone & Cake Logic
        let audioContext, analyser, microphone, audioStream;
        let currentProgress = 0;
        let isUnlocked = false;
        let animationFrameId;
        const candleElements = [];
        
        const audio = document.getElementById('bg-audio');
        const btnInit = document.getElementById('btn-init-mic');
        const initState = document.getElementById('init-state');
        const blowState = document.getElementById('blow-state');
        const candlesContainer = document.getElementById('candles-container');
        const progressBar = document.getElementById('blow-progress');
        const vinylDisc = document.getElementById('vinyl-disc');

        // Generate 19 Candles
        for(let i=0; i<19; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = "relative flex flex-col items-center";
            wrapper.innerHTML = `
                <div class="flame absolute -top-3 w-1.5 h-3 bg-gradient-to-t from-orange-400 via-yellow-300 to-yellow-100 rounded-full blur-[0.5px]"></div>
                <div class="w-1.5 h-5 bg-gradient-to-r from-pink-400 to-pink-500 rounded-sm shadow-sm border border-pink-300"></div>
            `;
            candlesContainer.appendChild(wrapper);
            candleElements.push(wrapper);
        }

        const updateCandleExtinguishState = () => {
            const candlesToExtinguish = Math.floor((currentProgress / 100) * 19);
            document.getElementById('candles-blown-count').textContent = `${Math.min(19, candlesToExtinguish)} / 19 blown`;
            progressBar.style.width = `${currentProgress}%`;

            candleElements.forEach((candle, index) => {
                if (index < candlesToExtinguish && !candle.classList.contains('extinguished')) {
                    candle.classList.add('extinguished');
                }
            });
        };

        document.getElementById('cake-interactive').addEventListener('click', () => {
            if (isUnlocked) return;
            // Faster tap rate (4 taps unlocks)
            currentProgress = Math.min(100, currentProgress + 25);
            updateCandleExtinguishState();
            if (currentProgress >= 100) {
                isUnlocked = true;
                executeUnlockSequence();
            }
        });

        btnInit.addEventListener('click', async () => {
            // Silently load audio to satisfy iOS
            audio.load();
            
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
                
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.4;
                
                microphone = audioContext.createMediaStreamSource(audioStream);
                microphone.connect(analyser);
                
                initState.classList.add('hidden');
                blowState.classList.remove('hidden');
                setTimeout(() => blowState.classList.remove('opacity-0'), 100);
                
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                const detectBlow = () => {
                    if (isUnlocked) return;
                    analyser.getByteFrequencyData(dataArray);
                    
                    // STRICT BLOW DETECTION: Only look at extreme low frequencies (0-50Hz rumble)
                    let lowFreqEnergy = 0;
                    for (let i = 0; i < 4; i++) lowFreqEnergy += dataArray[i];
                    const lowAvg = lowFreqEnergy / 4;
                    
                    // High threshold to ignore talking
                    if (lowAvg > 195) {
                        // Rate limit: requires sustained blow
                        currentProgress = Math.min(100, currentProgress + 1.2); 
                    }
                    // Removed decrement logic so candles stay blown out
                    
                    updateCandleExtinguishState();

                    if (currentProgress >= 100) {
                        isUnlocked = true;
                        executeUnlockSequence();
                        return;
                    }
                    animationFrameId = requestAnimationFrame(detectBlow);
                };
                detectBlow();
                
            } catch (err) {
                console.error("Mic access denied or failed", err);
                // Fallback to tap
                initState.classList.add('hidden');
                blowState.classList.remove('hidden');
                setTimeout(() => blowState.classList.remove('opacity-0'), 100);
            }
        });

        const executeUnlockSequence = () => {
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            candleElements.forEach(f => f.classList.add('extinguished'));
            document.getElementById('candles-blown-count').textContent = "19 / 19 blown! ✨";
            document.getElementById('blow-instruction').textContent = "Happiest Birthday Arya! ❤️";
            
            if (audioStream) audioStream.getTracks().forEach(track => track.stop());
            if (audioContext && audioContext.state !== 'closed') audioContext.close().catch(() => {});

            // Clean Audio Restart (iOS Safe)
            try {
                audio.currentTime = 0;
                audio.volume = 0;
                audio.play().then(() => {
                    let vol = 0;
                    const fadeInterval = setInterval(() => {
                        vol += 0.05;
                        if (vol >= 0.65) {
                            audio.volume = 0.65;
                            clearInterval(fadeInterval);
                        } else {
                            audio.volume = vol;
                        }
                    }, 150);
                }).catch(e => console.log("Unlock audio fail:", e));
            } catch (e) {}

            vinylDisc.classList.remove('vinyl-paused');

            setTimeout(() => {
                const lockScreen = document.getElementById('lock-screen');
                lockScreen.style.opacity = '0';
                lockScreen.style.transform = 'scale(0.95)';
                
                const mainContent = document.getElementById('main-content');
                mainContent.classList.remove('hidden');
                
                setTimeout(() => {
                    lockScreen.remove();
                    mainContent.classList.remove('opacity-0');
                    document.body.style.overflow = 'auto'; // allow native scroll
                }, 800);
            }, 1000);
        };

        // Scroll & Parallax Logic
        const revealElements = document.querySelectorAll('.reveal-element');
        const progressBarScroll = document.getElementById('scroll-progress');
        
        window.addEventListener('scroll', () => {
            if (!isUnlocked) return;
            
            const scrollPx = document.documentElement.scrollTop;
            const winHeightPx = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = `${(scrollPx / winHeightPx) * 100}%`;
            progressBarScroll.style.width = scrolled;

            const triggerBottom = window.innerHeight * 0.85;
            revealElements.forEach(el => {
                const box = el.getBoundingClientRect();
                if(box.top < triggerBottom) el.classList.add('visible');
            });
        });

        // Initialize Carousel
        const carousel = document.getElementById('photo-carousel');
        const indicatorsContainer = document.getElementById('carousel-indicators');
        
        CONFIG.photos.forEach((photoObj, index) => {
            // Alternate rotations
            const rotation = (index % 2 === 0 ? -1 : 1) * (0.8 + (index % 3) * 0.4);
            const cardWrapper = document.createElement('div');
            cardWrapper.className = "shrink-0 w-[84vw] max-w-[340px] snap-always snap-center flex justify-center py-3 px-2";
            
            // Added pointer-events-none and select-none to image to fix dragging bug
            cardWrapper.innerHTML = `
                <div class="polaroid-card w-full rounded-sm p-3 pb-6 flex flex-col items-center" style="transform: rotate(${rotation}deg);">
                    <div class="w-full h-[52vh] max-h-[380px] bg-pink-50/40 rounded-[2px] overflow-hidden flex items-center justify-center relative shadow-inner">
                        <img src="${encodeURI(photoObj.src)}" alt="Our gallery" draggable="false" ${index === 0 ? '' : 'loading="lazy"'} 
                             class="w-full h-full object-contain pointer-events-none select-none">
                    </div>
                    ${photoObj.caption ? `<div class="w-full text-center mt-3.5 px-2"><p class="font-hand text-xl text-brand-text/90 tracking-wide">${photoObj.caption}</p></div>` : ''}
                </div>
            `;
            carousel.appendChild(cardWrapper);

            // Create indicator dot
            const dot = document.createElement('div');
            dot.className = `h-1.5 rounded-full transition-all duration-300 ${index === 0 ? 'w-4 bg-brand-highlight' : 'w-1.5 bg-brand-highlight/30'}`;
            indicatorsContainer.appendChild(dot);
        });

        // Carousel Scroll Tracker
        carousel.addEventListener('scroll', () => {
            const scrollLeft = carousel.scrollLeft;
            const itemWidth = carousel.clientWidth;
            const activeIndex = Math.round(scrollLeft / itemWidth);
            
            document.getElementById('gallery-counter').textContent = activeIndex + 1;
            
            Array.from(indicatorsContainer.children).forEach((dot, i) => {
                dot.className = `h-1.5 rounded-full transition-all duration-300 ${i === activeIndex ? 'w-4 bg-brand-highlight' : 'w-1.5 bg-brand-highlight/30'}`;
            });
        }, { passive: true });

        // Run Init
        generateParticles();
    </script>
</body>
</html>
