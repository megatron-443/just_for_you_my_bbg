<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="preload" as="image" href="image%20(1).webp">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['"DM Serif Display"', 'serif'] },
                    colors: {
                        brand: { text: '#4a3242', highlight: '#d51a67', subtext: '#8a717e' }
                    },
                    animation: { 'spin-slow': 'spin 8s linear infinite' }
                }
            }
        }
    </script>

    <style>
        body {
            /* Rich blush-to-rose gradient (Authentic palette) */
            background: linear-gradient(180deg, #ffdbe6 0%, #ffccd8 30%, #fec5d8 60%, #fbcfe8 100%);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body.locked { overflow: hidden; height: 100dvh; }

        /* Hide Scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Authentic Glassmorphism - Ultra Sheer Lens */
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            /* Specular rim lighting (top/left bright, bottom dark) */
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9), 
                        inset 1px 0 1px rgba(255, 255, 255, 0.4),
                        0 20px 40px rgba(213, 26, 103, 0.08);
        }
        
        /* Solid lock screen panel */
        .glass-panel-solid { 
            background: rgba(255, 255, 255, 0.96); 
            box-shadow: 0 20px 50px rgba(220, 150, 170, 0.25); 
        }

        /* Instagram Carousel Dots */
        .dot { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .dot.active { opacity: 1; transform: scale(1.3); background-color: #d51a67; }

        /* Deep Background Particles (Bokeh & Tumbling) */
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: var(--max-opacity); }
            90% { opacity: var(--max-opacity); }
            100% { transform: translateY(-15vh) rotate(var(--rot)); opacity: 0; }
        }
        
        @keyframes tumbleDown {
            0% { transform: translateY(-10vh) rotate3d(1, 1, 0, 0deg); opacity: 0; }
            10% { opacity: var(--max-opacity); }
            90% { opacity: var(--max-opacity); }
            100% { transform: translateY(110vh) rotate3d(1, 1.5, 0.5, 720deg); opacity: 0; }
        }
        
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
        }

        .particle-item { position: fixed; pointer-events: none; will-change: transform; z-index: 10; }
        .bokeh-item { position: fixed; pointer-events: none; z-index: 1; }

        /* Distinct Branch Swaying */
        @keyframes swayTop {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(-2deg); }
        }
        @keyframes swayBottom {
            0%, 100% { transform: scaleX(-1) rotate(-15deg); }
            50% { transform: scaleX(-1) rotate(-10deg); }
        }
        .branch-top { transform-origin: top left; animation: swayTop 8s ease-in-out infinite; }
        .branch-bottom { transform-origin: bottom right; animation: swayBottom 9s ease-in-out infinite; }

        /* Vinyl Styling */
        .vinyl-grooves { background: repeating-radial-gradient( #111 0px, #1a1a1a 2px, #111 4px ); }
        .vinyl-paused { animation-play-state: paused !important; }

        /* Scroll Reveal Pacing */
        .reveal-item {
            opacity: 0;
            transform: translateY(25px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Candle & Flame Styling */
        .candle-body {
            width: 6px;
            height: 24px;
            background: linear-gradient(to right, #fca5a5, #f87171, #ef4444);
            border-radius: 3px;
            position: relative;
        }
        .candle-wick {
            width: 2px;
            height: 4px;
            background: #4b5563;
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
        }
        .flame {
            width: 10px;
            height: 16px;
            background: radial-gradient(ellipse at bottom, #fde047 10%, #fb923c 70%, transparent 100%);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            transform-origin: bottom;
            animation: flicker 0.1s infinite alternate;
            transition: opacity 0.4s ease;
        }
        .flame.extinguished { opacity: 0; animation: none; }
        
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(0.95) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1.05) rotate(2deg); }
        }
    </style>
</head>
<body class="relative font-serif flex flex-col items-center text-brand-text locked">

        <div class="glass-panel-solid relative w-full max-w-[22rem] rounded-[2rem] px-8 py-10 flex flex-col items-center">

            <!-- Snap-always ensures crisp Instagram-style pagination -->

    <!-- ============================================================== -->
    <!-- LOGIC SCRIPT                                                   -->
    <!-- ============================================================== -->
    <script>
        // --- 1. Content Injection & Scroll Reveal Formatting ---
        document.getElementById('bg-audio').src = CONFIG.musicUrl;
        document.getElementById('ui-song-name').textContent = CONFIG.songName;
        document.getElementById('mini-song-name').textContent = CONFIG.songName;
        document.getElementById('ui-artist-name').textContent = CONFIG.artistName;
        document.getElementById('ui-album-art').src = CONFIG.albumArt;
        document.getElementById('mini-album-art').src = CONFIG.albumArt;
        document.getElementById('ui-greeting').textContent = CONFIG.greeting;
        
        const paraContainer = document.getElementById('ui-paragraphs');
        const dividersAfter = [1, 3, 7];
        const pullQuoteIndex = 4;

        CONFIG.paragraphs.forEach((text, index) => {
            const p = document.createElement('p');
            p.textContent = text;
            if (index === pullQuoteIndex) {
                p.className = "reveal-item text-[1.6rem] leading-snug italic font-semibold text-brand-highlight my-10 py-8 border-y border-brand-highlight/20 relative";
            } else {
                p.className = "reveal-item";
            }
            paraContainer.appendChild(p);

            if (dividersAfter.includes(index)) {
                const divider = document.createElement('div');
                divider.className = "reveal-item text-brand-highlight/40 text-center tracking-[0.5em] text-lg my-2";
                divider.innerHTML = "✦ &nbsp;· &nbsp;✧ &nbsp;· &nbsp;✦";
                paraContainer.appendChild(divider);
            }
        });
        
        document.getElementById('ui-signoff-text').textContent = CONFIG.signOffText;
        document.getElementById('ui-signoff-name').textContent = CONFIG.signOffName;

        // --- 2. Audio Engine & Vinyl Syncing ---
        const audio = document.getElementById('bg-audio');
        const vinylDisc = document.getElementById('vinyl-disc');
        const miniVinylDisc = document.getElementById('mini-vinyl-disc');
        const mainVinylPlayer = document.getElementById('vinyl-player');
        const miniVinylBtn = document.getElementById('mini-vinyl-btn');
        
        const toggleAudio = () => {
            if (audio.paused) {
                audio.play();
                vinylDisc.classList.remove('vinyl-paused');
                miniVinylDisc.classList.remove('vinyl-paused');
            } else {
                audio.pause();
                vinylDisc.classList.add('vinyl-paused');
                miniVinylDisc.classList.add('vinyl-paused');
            }
        };
        mainVinylPlayer.addEventListener('click', toggleAudio);
        miniVinylBtn.addEventListener('click', toggleAudio);

        // --- 3. Interactive Microphone Candle Engine ---
        const btnLightCandles = document.getElementById('btn-light-candles');
        const triggerState = document.getElementById('trigger-state');
        const blowState = document.getElementById('blow-state');
        const candlesContainer = document.getElementById('candles-container');
        const blowProgressBar = document.getElementById('blow-progress');
        const blowInstruction = document.getElementById('blow-instruction');
        
        let audioStream = null;
        let isUnlocked = false;

        // Generate exactly 19 candles
        for (let i = 0; i < 19; i++) {
            const candle = document.createElement('div');
            candle.className = 'candle-body shadow-sm';
            // slight height variation for realism
            candle.style.height = (20 + Math.random() * 8) + 'px';
            candle.innerHTML = `
                <div class="candle-wick"></div>
                <div class="flame flame-icon"></div>
            `;
            candlesContainer.appendChild(candle);
        }

        btnLightCandles.addEventListener('click', async () => {
            // THE IOS HACK: Play audio immediately on user tap, but mute it so it's a secret
            audio.volume = 0;
            audio.play().catch(e => console.log("Audio native play prevented:", e));
            
            try {
                // Request Mic Permission
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // Swap UI States
                triggerState.classList.add('hidden');
                blowState.classList.remove('hidden');
                setTimeout(() => blowState.classList.remove('opacity-0'), 50);

                // Start Web Audio API processing
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(audioStream);
                
                microphone.connect(analyser);
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                let currentProgress = 0;
                
                const detectBlow = () => {
                    if(isUnlocked) return;
                    analyser.getByteFrequencyData(dataArray);
                    
                    let sum = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                    }
                    let average = sum / bufferLength;

                    // Blowing hard creates a high average volume (threshold > 80 usually signifies blowing)
                    if(average > 80) {
                        currentProgress += 1.5; // Fill up fast
                    } else {
                        currentProgress -= 0.5; // Drain slowly if they stop
                    }
                    
                    currentProgress = Math.max(0, Math.min(100, currentProgress));
                    blowProgressBar.style.width = currentProgress + '%';

                    if (currentProgress >= 100) {
                        isUnlocked = true;
                        executeUnlockSequence();
                    } else {
                        requestAnimationFrame(detectBlow);
                    }
                };
                
                detectBlow();

            } catch (err) {
                // If they deny mic access, fall back to a tap unlock
                console.warn("Microphone access denied or unavailable", err);
                blowInstruction.textContent = "Mic access needed. Tap here to unlock manually.";
                triggerState.classList.add('hidden');
                blowState.classList.remove('hidden');
                blowState.classList.remove('opacity-0');
                blowInstruction.addEventListener('click', () => { isUnlocked = true; executeUnlockSequence(); });
            }
        });

        const executeUnlockSequence = () => {
            // 1. Extinguish Flames
            document.querySelectorAll('.flame-icon').forEach(f => f.classList.add('extinguished'));
            if(audioStream) audioStream.getTracks().forEach(track => track.stop());

            // 2. Smoothly fade the secretly playing music up to 60%
            let vol = 0;
            const fadeInterval = setInterval(() => {
                vol += 0.05;
                audio.volume = Math.min(vol, 0.6);
                if (vol >= 0.6) clearInterval(fadeInterval);
            }, 200);

            vinylDisc.classList.remove('vinyl-paused');
            miniVinylDisc.classList.remove('vinyl-paused');

            // 3. Transition UI
            setTimeout(() => {
                const lockScreen = document.getElementById('pin-screen');
                lockScreen.style.opacity = '0';
                lockScreen.style.pointerEvents = 'none';
                
                document.body.classList.remove('locked');
                const main = document.getElementById('main-content');
                main.style.opacity = '1';
                main.style.pointerEvents = 'auto';
                main.classList.remove('translate-y-8');
                main.classList.add('translate-y-0');
                
                document.getElementById('scroll-progress-container').style.opacity = '1';

                setTimeout(() => mainVinylPlayer.classList.remove('opacity-0'), 800);
                setTimeout(() => lockScreen.remove(), 1000);
            }, 800);
        };

        // --- 4. Intersection Observers (Scroll Reveal & Sticky Vinyl) ---
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: "0px 0px -50px 0px" });

        document.querySelectorAll('.reveal-item').forEach(el => revealObserver.observe(el));

        const playerObserver = new IntersectionObserver((entries) => {
            const isMainVisible = entries[0].isIntersecting;
            if (isMainVisible || document.body.classList.contains('locked')) {
                miniVinylBtn.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
                miniVinylBtn.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
            } else {
                miniVinylBtn.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
                miniVinylBtn.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
            }
        }, { threshold: 0 });
        playerObserver.observe(mainVinylPlayer);

        // --- 5. Love Meter (Scroll Progress) ---
        const progressBar = document.getElementById('scroll-progress');
        window.addEventListener('scroll', () => {
            if (document.body.classList.contains('locked')) return;
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = Math.min(100, Math.max(0, (scrollTop / docHeight) * 100));
            progressBar.style.width = scrollPercent + '%';
        });

        // --- 6. Carousel Logic (Instagram Style) ---
        const carousel = document.getElementById('ui-carousel');
        const dotsContainer = document.getElementById('carousel-dots-container');

        CONFIG.photos.forEach((fileName, index) => {
            const safeUrl = encodeURI(fileName);
            const item = document.createElement('div');
            item.className = "shrink-0 w-full h-full snap-always snap-center flex items-center justify-center px-2";
            const lazyAttr = index === 0 ? '' : 'loading="lazy"';
            item.innerHTML = `<img src="${safeUrl}" alt="You from my eyes~" ${lazyAttr} class="w-full h-full object-contain drop-shadow-md rounded-xl">`;
            carousel.appendChild(item);

            const dot = document.createElement('div');
            dot.className = `dot w-2 h-2 rounded-full bg-brand-subtext/30 ${index === 0 ? 'active bg-brand-highlight' : ''}`;
            dotsContainer.appendChild(dot);
        });

        const dots = dotsContainer.children;
        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / carousel.offsetWidth);
            for(let i = 0; i < dots.length; i++) {
                if(i === index) {
                    dots[i].classList.add('active', 'bg-brand-highlight');
                    dots[i].classList.remove('bg-brand-subtext/30');
                } else {
                    dots[i].classList.remove('active', 'bg-brand-highlight');
                    dots[i].classList.add('bg-brand-subtext/30');
                }
            }
        });

        // --- 7. Pure CSS Multi-Layer Particle System (GPU Optimized) ---
        const pContainer = document.getElementById('particles-container');
        const svgHeart = (c) => `<svg viewBox="0 0 24 24" fill="${c}" class="w-full h-full"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
        const svgPetal = () => `<svg viewBox="0 0 30 30" fill="#f472b6" class="w-full h-full"><path d="M15 0 C25 8 28 20 15 30 C2 20 5 8 15 0 Z"/></svg>`;
        const svgStar = () => `<svg viewBox="0 0 24 24" fill="#ffffff" class="w-full h-full drop-shadow-sm"><path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9L12 2Z"/></svg>`;

        // Macro Bokeh Hearts (Deep background)
        for (let i = 0; i < 6; i++) {
            const el = document.createElement('div');
            el.className = 'bokeh-item';
            const size = Math.random() * 100 + 80;
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = (Math.random() * 100) + 'vw';
            el.style.top = (Math.random() * 100) + 'vh';
            el.style.filter = 'blur(15px)';
            el.style.opacity = Math.random() * 0.4 + 0.1;
            el.innerHTML = svgHeart('rgba(251,113,133,0.8)');
            el.style.animation = `pulseGlow ${Math.random() * 10 + 10}s ease-in-out infinite alternate`;
            pContainer.appendChild(el);
        }

        // Floating Hearts, Stars & Tumbling Petals
        for (let i = 0; i < 25; i++) {
            const el = document.createElement('div');
            el.className = 'particle-item';
            const rand = Math.random();
            let size, isFalling = false;
            
            if (rand < 0.5) { // Hearts
                el.innerHTML = svgHeart('rgba(244, 114, 182, 0.6)');
                size = Math.random() * 20 + 12;
            } else if (rand < 0.8) { // Sakura Petals
                el.innerHTML = svgPetal();
                size = Math.random() * 12 + 8;
                isFalling = true;
            } else { // Stars
                el.innerHTML = svgStar();
                size = Math.random() * 6 + 4;
            }

            const duration = Math.random() * 20 + 15;
            const delay = Math.random() * -30; 
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = (Math.random() * 100) + 'vw';
            
            if (isFalling) {
                el.style.top = '0';
                el.style.animation = `tumbleDown ${duration * 0.7}s linear infinite`;
            } else {
                el.style.bottom = '0';
                el.style.animation = `floatUp ${duration}s linear infinite`;
            }
            
            el.style.animationDelay = `${delay}s`;
            el.style.setProperty('--rot', (Math.random() * 360) + 'deg');
            el.style.setProperty('--max-opacity', isFalling ? 0.9 : Math.random() * 0.5 + 0.3);
            pContainer.appendChild(el);
        }
    </script>
</body>
</html>
