<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Letter Just For You</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <!-- Preload first image for instant reveal -->
    <link rel="preload" as="image" href="image%20(1).webp">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['"DM Serif Display"', 'serif'] },
                    colors: {
                        brand: { text: '#4a3242', highlight: '#d51a67', subtext: '#8a717e' }
                    },
                    animation: { 'spin-slow': 'spin 8s linear infinite' }
                }
            }
        }
    </script>

    <style>
        body {
            /* Rich blush-to-rose gradient matching justmeantforyou reference */
            background: linear-gradient(180deg, #ffdbe6 0%, #ffccd8 30%, #fec5d8 60%, #fbcfe8 100%);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Prevent scrolling while locked */
        body.locked {
            overflow: hidden;
            height: 100vh;
        }

        /* Authentic Glassmorphism - Translucent Milky Canvas */
        .glass-panel {
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 45px rgba(225, 120, 160, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        }
        
        /* Solid lock screen panel */
        .glass-panel-solid { 
            background: rgba(255, 255, 255, 0.96); 
            box-shadow: 0 20px 40px rgba(220, 150, 170, 0.2); 
        }

        /* Hide Scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Instagram Carousel Dots */
        .dot { transition: all 0.3s ease; }
        .dot.active { opacity: 1; transform: scale(1.2); background-color: #d51a67; }

        /* Pure CSS GPU Particles */
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: var(--max-opacity); }
            90% { opacity: var(--max-opacity); }
            100% { transform: translateY(-15vh) rotate(var(--rot)); opacity: 0; }
        }
        
        @keyframes tumbleDown {
            0% { transform: translateY(-10vh) rotate3d(1, 1, 0, 0deg); opacity: 0; }
            10% { opacity: var(--max-opacity); }
            90% { opacity: var(--max-opacity); }
            100% { transform: translateY(110vh) rotate3d(1, 1.5, 0.5, 720deg); opacity: 0; }
        }
        
        .particle-item { position: fixed; pointer-events: none; will-change: transform; }

        /* Distinct Branch Swaying */
        @keyframes swayTop {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(-2deg); }
        }
        @keyframes swayBottom {
            0%, 100% { transform: scaleX(-1) rotate(-15deg); }
            50% { transform: scaleX(-1) rotate(-12deg); }
        }
        .branch-top { transform-origin: top left; animation: swayTop 8s ease-in-out infinite; }
        .branch-bottom { transform-origin: bottom right; animation: swayBottom 9s ease-in-out infinite; }

        /* Vinyl Styling */
        .vinyl-grooves { background: repeating-radial-gradient( #111 0px, #1a1a1a 2px, #111 4px ); }
        .vinyl-paused { animation-play-state: paused !important; }
        
        /* Input Hacks */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
        .shake { animation: shake 0.4s ease-in-out; color: #ef4444; }
        #passcode-input { caret-color: transparent; color: transparent; background: transparent; }
    </style>
</head>
<body class="relative font-serif flex flex-col items-center text-brand-text locked">

    <!-- ============================================================== -->
    <!-- CONFIGURATION BLOCK                                            -->
    <!-- ============================================================== -->
    <script>
        const CONFIG = {
            passcode: "deep", // The 4 letters following "i love"
            
            songName: "dTmf",
            artistName: "Lil Baby Grand",
            albumArt: "cover.webp", 

            greeting: "My dearest Arya,",
            paragraphs: [
                "Today, 26th of September 2026 marks 19 years of your life on this planet",
                "Happiest of the happiest birthday to you my baby and I hope you have a great day today and all the upcoming days of your life 🥹❤️",
                "My love, I want you to know that every bit of happiness, joy and pleasure you get in your life it all belongs to you because you deserve it. You deserve all of it. I know that because I have been the longest AND closest with you and no one knows you better than me, so trust me when I say that you’re someone who deserves every ounce of happiness they get.",
                "The point is, I want you to see the kind of person you are. That is, a loving daughter who is willing to spend any amount to give her parents the life they deserve, the sister who is so protective and caring towards her brother even when he does something bad, the best friend who every person in their life needs, the available & helpful friend, the supportive & pushy & loving & caring wife— I can't put it into words how beautiful of a person you are, it would require me books to describe it, and that is just your personality. Describing your beauty and the way you look would take hundreds of books."
            ],
            signOffText: "Yours loving & caring",
            signOffName: "— Joy",
            
            photos: [
                "image (1).webp", "image (2).webp", "image (3).webp", "image (4).webp", 
                "image (5).webp", "image (6).webp", "image (7).webp", "image (8).webp", 
                "image (9).webp", "image (10).webp", "image (11).webp", "image (12).webp", 
                "image (13).webp", "image (14).webp"
            ]
        };
    </script>
    <!-- ============================================================== -->

    <!-- Ambient Background Particles -->
    <div id="particles-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>
    
    <!-- Distinct, Offset Sakura Branches -->
    <div class="fixed top-0 left-0 pointer-events-none z-10 w-64 md:w-80 opacity-90 -translate-x-4 -translate-y-4 branch-top">
        <img src="branch.png" alt="" class="w-full h-auto drop-shadow-xl" onerror="this.style.display='none'">
    </div>
    <!-- Flipped horizontally, anchored to the bottom right for organic distinction -->
    <div class="fixed bottom-0 right-0 pointer-events-none z-10 w-72 md:w-96 opacity-90 translate-x-4 translate-y-6 branch-bottom">
        <img src="branch.png" alt="" class="w-full h-auto drop-shadow-xl" onerror="this.style.display='none'">
    </div>

    <!-- ============================================================== -->
    <!-- LOCK SCREEN                                                    -->
    <!-- ============================================================== -->
    <div id="pin-screen" class="fixed inset-0 h-[100dvh] z-50 flex items-center justify-center p-6 transition-all duration-1000 ease-in-out bg-black/10 backdrop-blur-sm">
        <div class="glass-panel-solid relative w-full max-w-sm rounded-[2rem] px-8 py-10 flex flex-col items-center">
            
            <div class="w-12 h-12 rounded-full bg-pink-50 flex items-center justify-center mb-4 text-brand-highlight border border-pink-100 shadow-sm">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            </div>

            <h2 class="text-[2.2rem] text-brand-highlight mb-8 font-bold text-center leading-tight">A letter for you</h2>

            <!-- Hidden-Mirror Input -->
            <div class="relative flex items-center justify-center text-brand-text mb-8 w-full cursor-text py-2" onclick="document.getElementById('passcode-input').focus()">
                <span class="mr-3 text-2xl tracking-wide italic mt-1 font-semibold">i love</span>
                <div class="flex gap-2 mt-2" id="slot-container">
                    <!-- Underline Slots -->
                    <span class="slot w-6 text-center border-b-[3px] border-gray-300 h-8 leading-8 text-2xl font-bold transition-colors"></span>
                    <span class="slot w-6 text-center border-b-[3px] border-gray-300 h-8 leading-8 text-2xl font-bold transition-colors"></span>
                    <span class="slot w-6 text-center border-b-[3px] border-gray-300 h-8 leading-8 text-2xl font-bold transition-colors"></span>
                    <span class="slot w-6 text-center border-b-[3px] border-gray-300 h-8 leading-8 text-2xl font-bold transition-colors"></span>
                </div>
                <!-- Invisible Input for Native iOS Keyboard -->
                <input type="text" id="passcode-input" maxlength="4" class="absolute inset-0 opacity-0 w-full h-full cursor-text z-10" style="font-size: 16px;" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none">
            </div>
            
            <button id="unlock-btn" class="w-full bg-brand-highlight hover:bg-pink-700 text-white font-sans font-medium tracking-wide text-lg py-3.5 rounded-full shadow-md transition-all active:scale-95 flex items-center justify-center gap-2">
                🔒 Unlock
            </button>
        </div>
        
        <!-- Audio Player -->
        <audio id="bg-audio" src="song.mp3" loop preload="auto"></audio>
    </div>

    <!-- ============================================================== -->
    <!-- MAIN LETTER CONTENT                                            -->
    <!-- ============================================================== -->
    <main id="main-content" class="relative z-20 w-full max-w-xl mx-auto px-5 py-12 flex flex-col items-center opacity-0 pointer-events-none transition-all duration-[1500ms] ease-out min-h-screen overflow-x-hidden transform translate-y-8">
        
        <!-- Translucent Milky Canvas -->
        <article class="glass-panel w-full rounded-[2.5rem] px-6 md:px-10 py-12 flex flex-col items-center relative mt-6">
            
            <!-- Interactive Vinyl Player -->
            <div id="vinyl-player" class="flex flex-col items-center mb-10 w-full -mt-2 transition-all duration-1000 ease-in opacity-0 cursor-pointer group active:scale-95">
                <div class="relative w-44 h-44 rounded-full bg-black shadow-2xl flex items-center justify-center animate-spin-slow vinyl-grooves border-4 border-gray-900" id="vinyl-disc">
                    <div class="absolute inset-0 rounded-full bg-gradient-to-br from-white/20 via-transparent to-transparent pointer-events-none"></div>
                    <div class="relative w-16 h-16 rounded-full overflow-hidden border border-gray-600 bg-gray-800 flex items-center justify-center shadow-inner">
                        <img id="ui-album-art" src="" alt="Cover" class="w-full h-full object-cover" onerror="this.style.display='none'">
                        <div class="absolute w-3 h-3 bg-gray-900 rounded-full shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)] z-10"></div>
                    </div>
                </div>
                <div class="text-center mt-5">
                    <h3 id="ui-song-name" class="font-serif text-xl font-bold tracking-wide text-brand-text group-hover:text-brand-highlight transition-colors"></h3>
                    <p id="ui-artist-name" class="font-sans text-sm text-brand-subtext tracking-wider"></p>
                </div>
            </div>

            <!-- Letter Body with Book-like Structure (Centered) -->
            <h1 id="ui-greeting" class="text-[2.2rem] font-bold leading-tight text-brand-highlight mb-10 w-full text-center"></h1>
            
            <!-- Paragraph Container (Centered Text) -->
            <div id="ui-paragraphs" class="flex flex-col gap-8 text-[1.25rem] leading-relaxed text-brand-text font-medium w-full text-center"></div>
            
            <div class="mt-14 w-full text-center">
                <p id="ui-signoff-text" class="text-xl text-brand-highlight font-semibold"></p>
                <p id="ui-signoff-name" class="text-[2.2rem] italic mt-2 text-brand-text"></p>
            </div>
        </article>

        <!-- Image Carousel -->
        <section class="mt-12 w-full flex flex-col items-center pb-24 z-30 relative">
            <h2 class="font-serif text-2xl font-bold text-brand-highlight mb-6 tracking-wide text-center">You from my eyes~</h2>
            
            <div id="ui-carousel" class="w-full h-[50vh] flex overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth touch-pan-x"></div>
            <div id="carousel-dots-container" class="flex justify-center items-center gap-2 mt-6 flex-wrap px-4"></div>
        </section>
    </main>

    <!-- ============================================================== -->
    <!-- LOGIC SCRIPT                                                   -->
    <!-- ============================================================== -->
    <script>
        // --- 1. Audio Engine & Vinyl Interactivity ---
        const audio = document.getElementById('bg-audio');
        const vinylDisc = document.getElementById('vinyl-disc');
        const vinylPlayer = document.getElementById('vinyl-player');
        
        vinylPlayer.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                vinylDisc.classList.remove('vinyl-paused');
            } else {
                audio.pause();
                vinylDisc.classList.add('vinyl-paused');
            }
        });

        // --- 2. Passcode Logic ---
        const passInput = document.getElementById('passcode-input');
        const slots = document.querySelectorAll('.slot');
        const slotContainer = document.getElementById('slot-container');
        const unlockBtn = document.getElementById('unlock-btn');
        const TARGET_PASS = CONFIG.passcode.toLowerCase().trim();

        const unlockSequence = () => {
            const val = passInput.value.toLowerCase().trim();
            if (val === TARGET_PASS) {
                passInput.blur(); 
                
                audio.play().catch(e => console.log("Audio prevented:", e));

                document.getElementById('pin-screen').style.opacity = '0';
                document.getElementById('pin-screen').style.pointerEvents = 'none';
                
                document.body.classList.remove('locked');
                const main = document.getElementById('main-content');
                main.style.opacity = '1';
                main.style.pointerEvents = 'auto';
                main.classList.remove('translate-y-8');
                main.classList.add('translate-y-0');

                setTimeout(() => vinylPlayer.classList.remove('opacity-0'), 800);
                setTimeout(() => document.getElementById('pin-screen').remove(), 1000);
            } else {
                slotContainer.classList.remove('shake');
                void slotContainer.offsetWidth; // Reflow
                slotContainer.classList.add('shake');
                setTimeout(() => { passInput.value = ''; passInput.dispatchEvent(new Event('input')); }, 400);
            }
        };

        passInput.addEventListener('input', () => {
            const val = passInput.value.toLowerCase();
            slots.forEach((slot, index) => {
                slot.textContent = val[index] || '';
                if (val[index]) {
                    slot.classList.replace('border-gray-300', 'border-brand-highlight');
                    slot.classList.add('text-brand-highlight');
                } else {
                    slot.classList.replace('border-brand-highlight', 'border-gray-300');
                    slot.classList.remove('text-brand-highlight');
                }
            });
            slotContainer.classList.remove('shake');

            if (val.length === 4) {
                unlockSequence();
            }
        });

        passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') unlockSequence();
        });

        unlockBtn.addEventListener('click', unlockSequence);

        // --- 3. Populate Content ---
        document.getElementById('ui-song-name').textContent = CONFIG.songName;
        document.getElementById('ui-artist-name').textContent = CONFIG.artistName;
        document.getElementById('ui-album-art').src = CONFIG.albumArt;
        document.getElementById('ui-greeting').textContent = CONFIG.greeting;
        
        const paraContainer = document.getElementById('ui-paragraphs');
        CONFIG.paragraphs.forEach(text => {
            const p = document.createElement('p');
            p.textContent = text;
            paraContainer.appendChild(p);
        });
        
        document.getElementById('ui-signoff-text').textContent = CONFIG.signOffText;
        document.getElementById('ui-signoff-name').textContent = CONFIG.signOffName;

        // --- 4. Carousel Logic ---
        const carousel = document.getElementById('ui-carousel');
        const dotsContainer = document.getElementById('carousel-dots-container');

        CONFIG.photos.forEach((fileName, index) => {
            const safeUrl = encodeURI(fileName);
            const item = document.createElement('div');
            item.className = "shrink-0 w-full h-full snap-always snap-center flex items-center justify-center px-2";
            const lazyAttr = index === 0 ? '' : 'loading="lazy"';
            
            item.innerHTML = `<img src="${safeUrl}" alt="You from my eyes~" ${lazyAttr} class="w-full h-full object-contain drop-shadow-md rounded-xl">`;
            carousel.appendChild(item);

            const dot = document.createElement('div');
            dot.className = `dot w-2 h-2 rounded-full bg-brand-subtext/30 ${index === 0 ? 'active' : ''}`;
            dotsContainer.appendChild(dot);
        });

        const dots = dotsContainer.children;
        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / carousel.offsetWidth);
            for(let i = 0; i < dots.length; i++) {
                if(i === index) {
                    dots[i].classList.add('active', 'bg-brand-highlight');
                    dots[i].classList.remove('bg-brand-subtext/30');
                } else {
                    dots[i].classList.remove('active', 'bg-brand-highlight');
                    dots[i].classList.add('bg-brand-subtext/30');
                }
            }
        });

        // --- 5. Pure CSS Particles (Visible Rose & Pink Tones for True Translucency) ---
        const pContainer = document.getElementById('particles-container');
        const svgHeart = (c) => `<svg viewBox="0 0 24 24" fill="${c}" class="w-full h-full"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
        const svgPetal = () => `<svg viewBox="0 0 30 30" fill="#f472b6" class="w-full h-full"><path d="M15 0 C25 8 28 20 15 30 C2 20 5 8 15 0 Z"/></svg>`;
        const svgStar = () => `<svg viewBox="0 0 24 24" fill="#ffffff" class="w-full h-full drop-shadow-sm"><path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9L12 2Z"/></svg>`;

        for (let i = 0; i < 35; i++) {
            const el = document.createElement('div');
            el.className = 'particle-item';
            const rand = Math.random();
            let size, duration, delay, rot, isFalling = false;
            
            if (rand < 0.4) {
                // Large soft-blush bokeh hearts
                el.innerHTML = svgHeart('rgba(251, 113, 133, 0.45)');
                size = Math.random() * 90 + 70; 
                el.style.filter = `blur(${Math.random() * 6 + 10}px)`;
            } else if (rand < 0.65) {
                // Floating rose-tinted hearts
                el.innerHTML = svgHeart('rgba(244, 114, 182, 0.55)');
                size = Math.random() * 25 + 16;
            } else if (rand < 0.85) {
                // Falling petals
                el.innerHTML = svgPetal();
                size = Math.random() * 12 + 10;
                isFalling = true;
            } else {
                // Twinkling stars
                el.innerHTML = svgStar();
                size = Math.random() * 7 + 4;
            }

            duration = Math.random() * 25 + 15;
            delay = Math.random() * -30; 
            rot = (Math.random() * 360) + 'deg';

            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = (Math.random() * 100) + 'vw';
            
            if (isFalling) {
                el.style.top = '0';
                el.style.animation = `tumbleDown ${duration * 0.6}s linear infinite`;
            } else {
                el.style.bottom = '0';
                el.style.animation = `floatUp ${duration}s linear infinite`;
            }
            
            el.style.animationDelay = `${delay}s`;
            el.style.setProperty('--rot', rot);
            el.style.setProperty('--max-opacity', isFalling ? 0.9 : Math.random() * 0.5 + 0.3);
            
            pContainer.appendChild(el);
        }
    </script>
</body>
</html>
